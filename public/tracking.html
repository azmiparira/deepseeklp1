<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lacak Pesanan - Spray Tidur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" type="image/png" href="./assets/img/favicon.png" />
</head>
<body>

    <!-- ====== HEADER ====== -->
    <header class="main-header">
        <div class="header-left">
            <a href="./index.html" class="header-home"><i class="fas fa-home"></i> Beranda</a>
        </div>
        <div class="header-center">
            <span class="header-brand">Lacak Pesanan</span>
        </div>
        <div class="header-right">
            <button id="btn-back-to-home" class="header-track"><i class="fas fa-arrow-left"></i> Kembali</button>
        </div>
    </header>

    <div class="container" style="padding-top: 20px;">

        <!-- ===== SECTION TRACKING ===== -->
        <section id="section-tracking" class="section active">
            <div class="tracking-page">
                <h2><i class="fas fa-map-pin"></i> Lacak Pesanan</h2>
                <p style="color:#666; font-size:14px; margin-bottom:16px;">Masukkan nomor HP yang kamu gunakan saat checkout.</p>
                <div class="tracking-form">
                    <input type="tel" id="track-phone" placeholder="Masukkan No HP (contoh: 081234567890)" required />
                    <button id="btn-track-submit" class="btn-primary"><i class="fas fa-search"></i> Cari</button>
                </div>
                <div id="tracking-result" class="tracking-result" style="display:none;"></div>
                <button id="btn-back-home-track" class="btn-secondary" style="margin-top:16px;">Kembali ke Beranda</button>
            </div>
        </section>

    </div>

    <footer class="sticky-footer" style="position:relative; margin-top:30px;">
        <div style="text-align:center; font-size:12px; color:#999; padding:8px 0;">
            © 2026 Spray Tidur — All rights reserved
        </div>
    </footer>

    <script>
        window.GS_API_URL = 'https://script.google.com/macros/s/AKfycbzs2sIrux8crIhssdzUbTbbFp1hzpZlc6U_V2XkbgoYuszlXN730E4IbSSNwULiDYVe/exec';
    </script>
    <script src="./assets/js/tracking.js"></script>
</body>
</html>
